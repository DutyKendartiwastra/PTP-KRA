<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTP Kabupaten Karanganyar</title>
</head>
<body>
    <link rel="stylesheet" href="https://js.arcgis.com/4.24/esri/themes/dark/main.css"/>
    <script src="https://js.arcgis.com/4.24/"></script>
    <script>src="https://code.jquery.com/jquery-3.6.1.min.js"</script>
    <!-- Setting Halaman Full Screen -->
    <style>
     html,
     body,
     #viewDiv_Vektor {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
     #layerToggle {
        bottom: -10%;
        left: 55px;
        position:absolute;
        z-index: 99;
        background-color: white;
        border-radius: 8px;
        padding: 10px;
        opacity: 0.75;
      }
     #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      #sidebar {
        z-index: 99;
        position: absolute;
        top: 10px;
        left: 60px;
        height: 6%;
        background: rgba(0, 0, 0, 0.3);
        width: 340px;
      }
      #sidebar2 {
        z-index: 99;
        position: absolute;
        top: 550px;
        left: 0px;
        height: 13%;
        background: rgba(240, 248, 254, 0);
        width: 400px;
      }
    </style>
    <!-- SETTING PASSWORD -->
    
    <!-- Mulai Coding Javascript -->
    <script>
     require([
     "esri/Map",
     "esri/views/MapView",
     "esri/layers/GeoJSONLayer",
     "esri/widgets/BasemapToggle",
     "esri/widgets/Expand",
     "esri/widgets/Legend",
     "esri/popup/content/AttachmentsContent",
     "esri/popup/content/ExpressionContent",
     "esri/popup/content/TextContent",
     "esri/rest/query/support/AttachmentInfo",
     "esri/widgets/Locate",
     "esri/layers/ImageryLayer",
     "esri/widgets/Search",
     "esri/layers/ImageryTileLayer",
     "esri/widgets/Compass",
     "esri/widgets/Swipe",
     "esri/widgets/ScaleBar",
     "esri/widgets/LayerList",
     "esri/layers/GroupLayer",
     "esri/views/layers/LayerView",
     "esri/widgets/Fullscreen",
     "esri/layers/WCSLayer",
     "esri/layers/MapImageLayer",
     "esri/layers/WMSLayer",
     "esri/layers/WFSLayer",
     ],(
      Map,
      MapView,
      GeoJSONLayer,
      BasemapToggle,
      Expand,
      Legend,
      AttachmentsContent,
      ExpressionContent,
      TextContent,
      AttachmentInfo,
      Locate,
      ImageryLayer,
      Search,
      ImageryTileLayer,
      Compass,
      Swipe,
      ScaleBar,
      LayerList,
      GroupLayer,
      LayerView,
      Fullscreen,
      WCSLayer,
      MapImageLayer,
      WMSLayer,
      WFSLayer,
      )=>{
      //Buat Simbologi Batas Admin Api-api
      const Batas1 = {
          type: "simple-fill",
          color:[255, 252, 155,0],
          outline: {
            color: [255, 252, 155, 1],
            width: "1px",
            style: "solid"
          }
        };
      const renderer_kelurahan = {
          type: "simple",
          title:"Batas Bidang Tanah",
          symbol: Batas1}
      //Buat Simbologi Batas Kecamatan
      const BatasKEC = {
          type: "simple-fill",
          color:[34, 40, 49,0],
          outline: {
            color: [168, 161, 150, 1],
            width: "3px",
            style: "short-dash-dot-dot"
          }
        };
      const renderer_BatasKEC = {
          type: "simple",
          title:"Batas KEC",
          symbol: BatasKEC} 
      // Renderer Bidang PTP
      const renderer_Bidang_PTP = {
        type: "unique-value",
        legendOptions: {
        title: "Jenis Pertimbangan Teknis Pertanahan"},
        field: "Jenis",
        uniqueValueInfos: [
          {value: "BERUSAHA",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [145, 221, 207, 1],
                width: "1px",
                style: "solid"}
          }},
          {value: "NON BERUSAHA",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [255, 211, 90, 1],
                width: "1px",
                style: "solid"}
          }},
          {value: "KEBIJAKAN",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [220, 0, 131, 1],
                width: "1px",
                style: "solid"}
          }}
        ]};
      //Membuat Label Batas Kecamatan
      const labelBatasKecamatan = {
        symbol: {
          type: "text",
          color: [247, 249, 242],
          font: {
            family: "Avenir Next LT Pro Regular",
            size: 15,
            weight: "bold"
          }
        },
        labelPlacement: "above-center",
        labelExpressionInfo: {
          expression: "$feature.KEC"
        },
        minScale: 100000,
        maxScale: 20000,
      };
      //Membuat Label Batas Kelurahan
      const labelBatasKelurahan = {
        symbol: {
          type: "text",
          color: "#FFFC9B",
          font: {
            family: "Avenir Next LT Pro Regular",
            size: 15,
            weight: "bold"
          }
        },
        labelPlacement: "above-center",
        labelExpressionInfo: {
          expression: "$feature.DESA"
        },
        minScale: 20000,
        maxScale: 5000,
      };
      // Pop Up Template Bidang PTP
      const popup_BidangPTP={
        title:"Nama Pemohon : {NAMA}",
        content:[{
          type: "fields",
                fieldInfos: [
                  {
                    fieldName: "BERKAS",
                    label: "Nomor Berkas",
                  },
                  {
                    fieldName: "TANGGAL",
                    label: "Tanggal Berkas",
                  },
                  {
                    fieldName: "PERUNTUKAN",
                    label: "Peruntukan",
                  },
                  {
                    fieldName: "LUAS",
                    label: "Luas Permohonan (m2)",
                  },
                ]
        },
        {
          type:"text",
          title:"Tata Ruang",
          text:"<b>Tata Ruang : {ALAMAT}{Kawasan_B}{kws_C}<b>"
        },
        {
          type: "media",
                mediaInfos: [
                  {
                    title: "Hasil Pertimbangan Teknis Pertanahan",
                    type: "pie-chart",
                    value: {
                      fields: ["DISETUJUI","DITOLAK","disetuju_1"]
                    },
                  }
                ],
        }]
      };
      //Insert Basemap ATR/BPN
      const PetaDasar = new ImageryLayer({
          url: "https://petadasar.atrbpn.go.id/main/wms/{x}/{y}/{z}",
      });
      //Insert SHP Batas Kecamatan
      const Batas_Kecamatan=new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/Batas_kecamatan.geojson",
        title:"Batas Kecamatan",
        renderer:renderer_BatasKEC,
        labelingInfo:labelBatasKecamatan,
        minScale: 2000000,
        maxScale: 5000,
      });
      //Insert LSD Karanganyar
      const LSD=new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/LSD_compressed.geojson",
        title:"Lahan Sawah Dilindungi",
        visible:false,
      });
      //Batas Kelurahan
      const BatasAdmin_Kelurahan= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/Batas_kelurahan.geojson",
        title:"Batas Desa/Kelurahan",
        renderer:renderer_kelurahan,
        labelingInfo:labelBatasKelurahan,
        minScale: 20000,
        maxScale: 5000,
      });
      //RTRW
      const RTRW= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/RTRW.geojson",
        title:"RTRW Kabupaten Karanganyar 2019",
        visible:true,
      });
      //Bidang PTP
      const BidangPTP= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/BidangPTP.geojson",
        title:"Bidang Tanah Permohonan PTP",
        popupTemplate:popup_BidangPTP,
        renderer:renderer_Bidang_PTP,
      });
      //Fungsi create symbol
      function createSymbol(color){
          return {
            type: "simple-fill",
            style: "solid",
            color,
            outline: null
          };
        }
      // Insert Basemap
        const map = new Map({
          basemap: "dark-gray-vector",
      });
      // Menampilkan Map ke Bodi HTML
      const View = new MapView({
        container: "viewDiv",
        map: map,
        zoom:10,
        center:[110.950309,-7.598174]
      });

      // List Layer
      map.add(BatasAdmin_Kelurahan);
      map.add(Batas_Kecamatan);
      map.add(RTRW);
      map.add(LSD);
      map.add(BidangPTP);
      
      
      // Legend Muka Peta 1
      const legend = new Expand({
          content: new Legend({
            view: View,
            style: "classic", // other styles include 'classic/classic'
            layerInfos: [
              {
                layer: BidangPTP,
                title: "KETERANGAN"
              },
            ],
          view: View,
          expanded: false,
      })});
      View.ui.add(new Expand({
                    content: new LayerList({
                    view: View,
                  }),
              view: View,
              group: "bottom-left"}),
      "bottom-left");
      // Gonta-ganti basemap
      const toggle = new BasemapToggle({
          view: View,
          nextBasemap: "hybrid"
        });
      //Location Button
      const locateBtn = new Locate({
          view: View
        });
      //North
      const compassWidget = new Compass({
          view: View
        });
      //Scale Bar
      const scaleBar = new ScaleBar({
          view: View,
          unit: "dual" // The scale bar displays both metric and non-metric units.
        });

      //swipe
      const swipe = new Swipe({
          leadingLayers: ([BidangPTP,RTRW]),
          trailingLayers: ([BidangPTP,LSD]),
          position: 1, // set position of widget to 35%
          view: View
        });

      //FULL SCREEN
      fullscreen = new Fullscreen({
          view: View
        });
      View.ui.add(fullscreen, "top-left");
      //SEARCH
        const searchWidget = new Search({
          view: View,
          allPlaceholder: "Cari Berdasarkan",
          includeDefaultSources: false,
          sources: [
            {
              layer: Batas_Kecamatan,
              searchFields: ["KEC"],
              displayField: "KEC",
              exactMatch: false,
              outFields: ["KEC"],
              name: "KECAMATAN",
              zoomScale: 50000,
              placeholder: "Contoh: JUMANTONO"
            },
            {
              layer: BatasAdmin_Kelurahan,
              searchFields: ["DESA"],
              displayField: "DESA",
              exactMatch: false,
              outFields: ["DESA"],
              name: "DESA",
              zoomScale: 10000,
              placeholder: "Contoh: NGIJO"
            },
            {
              layer: BidangPTP,
              searchFields: ["Berkas"],
              displayField: "Berkas",
              exactMatch: false,
              outFields: ["Berkas"],
              name: "NOMOR BERKAS",
              zoomScale: 1000,
              placeholder: "Contoh: 51426/2023"
            }]
        });
      //Jajaran widget
        View.ui.add(searchWidget, {position: "top-right"});
        View.ui.add(locateBtn, {position: "top-left"});
        View.ui.add(toggle, "bottom-right");
        View.ui.add(compassWidget, "top-left");
        View.ui.add(swipe);
        View.ui.add(scaleBar, {position: "bottom-right"});
        View.ui.add(legend, "bottom-right");
      }
     )
    </script>
    <body>
      <div id="viewDiv"></div>
    </body>
    <body>
      <div id="sidebar" class="esri-widget">
        <div id="text">
            <img src="https://raw.githubusercontent.com/DutyKendartiwastra/Belajar1/main/Foto/LogoBPN.png" top=10px alt="logo" width="40" height="40">
            <h1 style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; top: 0px;left:80px;position:absolute;color: azure;font-size:large;">PTP Kabupaten Karanganyar</h1>
        </div>
      </div>
    </body>
</body>
</html>
