    <!-- Mulai Coding Javascript -->
    <script>
     require([
     "esri/Map",
     "esri/views/MapView",
     "esri/layers/GeoJSONLayer",
     "esri/widgets/BasemapToggle",
     "esri/widgets/Expand",
     "esri/widgets/Legend",
     "esri/popup/content/AttachmentsContent",
     "esri/popup/content/ExpressionContent",
     "esri/popup/content/TextContent",
     "esri/rest/query/support/AttachmentInfo",
     "esri/widgets/Locate",
     "esri/layers/ImageryLayer",
     "esri/widgets/Search",
     "esri/layers/ImageryTileLayer",
     "esri/widgets/Compass",
     "esri/widgets/Swipe",
     "esri/widgets/ScaleBar",
     "esri/widgets/LayerList",
     "esri/layers/GroupLayer",
     "esri/views/layers/LayerView",
     "esri/widgets/Fullscreen",
     "esri/layers/WCSLayer",
     "esri/layers/MapImageLayer",
     "esri/layers/WMSLayer",
     "esri/layers/WFSLayer",
     "esri/symbols/CIMSymbol",
     "esri/symbols/support/cimSymbolUtils",
     "esri/symbols/WebStyleSymbol",
     ],(
      Map,
      MapView,
      GeoJSONLayer,
      BasemapToggle,
      Expand,
      Legend,
      AttachmentsContent,
      ExpressionContent,
      TextContent,
      AttachmentInfo,
      Locate,
      ImageryLayer,
      Search,
      ImageryTileLayer,
      Compass,
      Swipe,
      ScaleBar,
      LayerList,
      GroupLayer,
      LayerView,
      Fullscreen,
      WCSLayer,
      MapImageLayer,
      WMSLayer,
      WFSLayer,
      CIMSymbol,
      cimSymbolUtils,
      WebStyleSymbol,
      )=>{
      //Buat Simbologi Batas Admin Api-api
      const Batas1 = {
          type: "simple-fill",
          color:[255, 252, 155,0],
          outline: {
            color: [255, 252, 155, 1],
            width: "1px",
            style: "solid"
          }
        };
      const renderer_kelurahan = {
          type: "simple",
          title:"Batas Bidang Tanah",
          symbol: Batas1}
      //Buat Simbologi Batas Kecamatan
      const BatasKEC = {
          type: "simple-fill",
          color:[34, 40, 49,0],
          outline: {
            color: [168, 161, 150, 1],
            width: "3px",
            style: "short-dash-dot-dot"
          }
        };
      const renderer_BatasKEC = {
          type: "simple",
          title:"Batas KEC",
          symbol: BatasKEC} 
      
      //Simbologi LSD
      const symbol_LSD ={
            type: "cim",
            data: {
              type: "CIMSymbolReference",
              symbol: {
                // CIM polygon symbol
                type: "CIMPolygonSymbol",
                symbolLayers: [{
                  // light blue outline around the polygon
                    type: "CIMSolidStroke",
                    enable: true,
                    width: 0.8,
                    color: [26, 83, 25,108]},
                   // light blue hatch fill
                   {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type      : "CIMSolidStroke",
                          enable    : true,
                          capStyle  : "Butt",
                          joinStyle : "Miter",
                          miterLimit: 10,
                          width     : 0.5,
                          color     : [128, 175, 129,255]
                      }]
                    },
                    rotation: 45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                  //
                  {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type        : "CIMSolidStroke",
                          enable      : true,
                          capStyle    : "Butt",
                          joinStyle   : "Miter",
                          miterLimit  : 10,
                          width       : 0.5,
                          color       : [128, 175, 129,255]
                      }]
                    },
                    rotation: -45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                ],
        }}};
      //CUSTOMISASI SIMBOL RTRW
      //Kawasan Permukiman Perkotaan
      const PERKOTAAN ={
            type: "cim",
            data: {
              type: "CIMSymbolReference",
              symbol: {
                // CIM polygon symbol
                type: "CIMPolygonSymbol",
                symbolLayers: [{
                  // light blue outline around the polygon
                    type: "CIMSolidStroke",
                    enable: true,
                    width: 0.8,
                    color: [233, 239, 236,108]},
                   // light blue hatch fill
                   {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type      : "CIMSolidStroke",
                          enable    : true,
                          capStyle  : "Butt",
                          joinStyle : "Miter",
                          miterLimit: 10,
                          width     : 0.5,
                          color     : [199,37,62,255]
                      }]
                    },
                    rotation: 45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                  //
                  {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type        : "CIMSolidStroke",
                          enable      : true,
                          capStyle    : "Butt",
                          joinStyle   : "Miter",
                          miterLimit  : 10,
                          width       : 0.5,
                          color       : [199,37,62,255]
                      }]
                    },
                    rotation: -45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                ],
        }}};
      //Kawasan Permukiman Perdesaan
      const PERDESAAN ={
            type: "cim",
            data: {
              type: "CIMSymbolReference",
              symbol: {
                // CIM polygon symbol
                type: "CIMPolygonSymbol",
                symbolLayers: [{
                  // light blue outline around the polygon
                    type: "CIMSolidStroke",
                    enable: true,
                    width: 0.8,
                    color: [233, 239, 236,108]},
                   // light blue hatch fill
                   {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type      : "CIMSolidStroke",
                          enable    : true,
                          capStyle  : "Butt",
                          joinStyle : "Miter",
                          miterLimit: 10,
                          width     : 1,
                          color     : [232, 92, 13,255]
                      }]
                    },
                    rotation: 45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                  //
                  {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type        : "CIMSolidStroke",
                          enable      : true,
                          capStyle    : "Butt",
                          joinStyle   : "Miter",
                          miterLimit  : 10,
                          width       : 0.5,
                          color       : [232,92,13,255]
                      }]
                    },
                    rotation: -45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                ],
        }}};
      //Kawasan Industri
      const INDUSTRI ={
            type: "cim",
            data: {
              type: "CIMSymbolReference",
              symbol: {
                // CIM polygon symbol
                type: "CIMPolygonSymbol",
                symbolLayers: [{
                  // light blue outline around the polygon
                    type: "CIMSolidStroke",
                    enable: true,
                    width: 0.8,
                    color: [233, 239, 236,108]},
                   // light blue hatch fill
                   {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type      : "CIMSolidStroke",
                          enable    : true,
                          capStyle  : "Butt",
                          joinStyle : "Miter",
                          miterLimit: 10,
                          width     : 1,
                          color     : [182, 146, 194,255]
                      }]
                    },
                    rotation: 45, // rotation of the lines
                    separation: 5 // distance between lines in hatch fill
                  },
                ],
        }}};
      //Kawasan Hortikultura
      const HORTIKULTURA ={
            type: "cim",
            data: {
              type: "CIMSymbolReference",
              symbol: {
                // CIM polygon symbol
                type: "CIMPolygonSymbol",
                symbolLayers: [{
                  // light blue outline around the polygon
                    type: "CIMSolidStroke",
                    enable: true,
                    width: 0.8,
                    color: [233, 239, 236,108]},
                   // light blue hatch fill
                   {type: "CIMHatchFill",
                    enable: true,
                    lineSymbol: {
                      type: "CIMLineSymbol", // CIM line symbol that makes up the line inside the hatch fill
                      symbolLayers: [{
                          type      : "CIMSolidStroke",
                          enable    : true,
                          capStyle  : "Butt",
                          joinStyle : "Miter",
                          miterLimit: 10,
                          width     : 2,
                          color     : [145, 221, 207,255]
                      }]
                    },
                    rotation: 45, // rotation of the lines
                    separation: 6 // distance between lines in hatch fill
                  },
                ],
        }}};
      //Simbologi RTRW
      const renderer_RTRW={
        type: "unique-value",
        legendOptions: {
         title: "RTRW Kab. Karanganyar Tahun 2019"},
         field: "NAMOBJ",
         uniqueValueInfos:[
          {value:"Kawasan Permukiman Perkotaan",
           symbol: PERKOTAAN,
          },
          {value:"Kawasan Permukiman Perdesaan",
           symbol: PERDESAAN,
          },
          {value:"Sempadan Sungai",
           symbol: {
              type: "simple-fill",
              color: [63, 162, 246,0.5],
              outline:{
                color: [233,239,236,80],
                width: "0.8px",
                style: "solid"}
          }},
          {value:"Kawasan Tanaman Pangan",
           symbol: {
              type: "simple-fill",
              color: [180,227,128,0.5],
              outline:{
                color: [233,239,236,80],
                width: "0.8px",
                style: "solid"}
          }},
          {value:"Sempadan Mata Air",
           symbol: {
              type: "simple-fill",
              color: [15,103,177,0.5],
              outline:{
                color: [233,239,236,80],
                width: "0.8px",
                style: "solid"}
          }},
          {value:"Kawasan Industri",
           symbol: INDUSTRI,
          },
          {value:"Kawasan Hortikultura",
           symbol: HORTIKULTURA,
          },
          {value:"Kawasan Rawan Bencana Gerakan Tanah",
           symbol: {
              type: "simple-fill",
              color: [247, 220, 185,0.5],
              outline:{
                color: [233,239,236,80],
                width: "0.8px",
                style: "solid"}
          }},
          {value:"Kawasan Cagar Budaya",
           symbol: {
              type: "simple-fill",
              color: [233, 239, 236,0.5],
              outline:{
                color: [233,239,236,80],
                width: "0.8px",
                style: "solid"}
          }},
        ]
      }
      
      // Renderer Bidang PTP
      const renderer_Bidang_PTP = {
        type: "unique-value",
        legendOptions: {
        title: "Jenis Pertimbangan Teknis Pertanahan"},
        field: "Jenis",
        uniqueValueInfos: [
          {value: "BERUSAHA",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [145, 221, 207, 1],
                width: "1px",
                style: "solid"}
          }},
          {value: "NON BERUSAHA",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [255, 211, 90, 1],
                width: "1px",
                style: "solid"}
          }},
          {value: "KEBIJAKAN",
          symbol: {
              type: "simple-fill",
              color: [1, 1, 1, 0],
              outline:{
                color: [220, 0, 131, 1],
                width: "1px",
                style: "solid"}
          }}
        ]};
      //Membuat Label Batas Kecamatan
      const labelBatasKecamatan = {
        symbol: {
          type: "text",
          color: [247, 249, 242],
          font: {
            family: "Avenir Next LT Pro Regular",
            size: 15,
            weight: "bold"
          }
        },
        labelPlacement: "above-center",
        labelExpressionInfo: {
          expression: "$feature.KEC"
        },
        minScale: 100000,
        maxScale: 20000,
      };
      //Membuat Label Batas Kelurahan
      const labelBatasKelurahan = {
        symbol: {
          type: "text",
          color: "#FFFC9B",
          font: {
            family: "Avenir Next LT Pro Regular",
            size: 15,
            weight: "bold"
          }
        },
        labelPlacement: "above-center",
        labelExpressionInfo: {
          expression: "$feature.DESA"
        },
        minScale: 20000,
        maxScale: 5000,
      };
      // Pop Up Template Bidang PTP
      const popup_BidangPTP={
        title:"Nama Pemohon : {NAMA}",
        content:[{
          type: "fields",
                fieldInfos: [
                  {
                    fieldName: "BERKAS",
                    label: "Nomor Berkas",
                  },
                  {
                    fieldName: "TANGGAL",
                    label: "Tanggal Berkas",
                  },
                  {
                    fieldName: "PERUNTUKAN",
                    label: "Peruntukan",
                  },
                  {
                    fieldName: "LUAS",
                    label: "Luas Permohonan (m2)",
                  },
                ]
        },
        {
          type:"text",
          title:"Tata Ruang",
          text:"<b>Tata Ruang : {ALAMAT}{Kawasan_B}{kws_C}<b>"
        },
        {
          type: "media",
                mediaInfos: [
                  {
                    title: "Hasil Pertimbangan Teknis Pertanahan",
                    type: "pie-chart",
                    value: {
                      fields: ["DISETUJUI","DITOLAK","disetuju_1"]
                    },
                  }
                ],
        }]
      };
      //Pop Up Template RTRW
      const popup_RTRW={
        title:"Kawasan : {NAMOBJ}",
      };
      //Insert Basemap ATR/BPN
      const PetaDasar = new ImageryLayer({
          url: "https://petadasar.atrbpn.go.id/main/wms/{x}/{y}/{z}",
      });
      //Insert SHP Batas Kecamatan
      const Batas_Kecamatan=new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/Batas_kecamatan.geojson",
        title:"Batas Kecamatan",
        renderer:renderer_BatasKEC,
        labelingInfo:labelBatasKecamatan,
        minScale: 2000000,
        maxScale: 5000,
      });
      //Insert LSD Karanganyar
      const LSD=new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/LSD_compressed.geojson",
        title:"Lahan Sawah Dilindungi",
        visible:false,
        renderer: {
          type: "simple",
          symbol:symbol_LSD,
      },
      });
      //Batas Kelurahan
      const BatasAdmin_Kelurahan= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/Batas_kelurahan.geojson",
        title:"Batas Desa/Kelurahan",
        renderer:renderer_kelurahan,
        labelingInfo:labelBatasKelurahan,
        minScale: 20000,
        maxScale: 5000,
      });
      //RTRW
      const RTRW= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/RTRW.geojson",
        title:"RTRW Kabupaten Karanganyar 2019",
        renderer:renderer_RTRW,
        visible:true,
        //popupTemplate:popup_RTRW,
      });
      //Bidang PTP
      const BidangPTP= new GeoJSONLayer({
        url:"https://raw.githubusercontent.com/DutyKendartiwastra/PTP-KRA/main/BidangPTP.geojson",
        title:"Bidang Tanah Permohonan PTP",
        popupTemplate:popup_BidangPTP,
        renderer:renderer_Bidang_PTP,
      });
      //Fungsi create symbol
      function createSymbol(color){
          return {
            type: "simple-fill",
            style: "solid",
            color,
            outline: null
          };
        }
      // Insert Basemap
        const map = new Map({
          basemap: "dark-gray-vector",
      });
      // Menampilkan Map ke Bodi HTML
      const View = new MapView({
        container: "viewDiv",
        map: map,
        zoom:10,
        center:[110.950309,-7.598174]
      });

      // List Layer
      map.add(LSD);
      map.add(RTRW);
      map.add(BidangPTP);
      map.add(BatasAdmin_Kelurahan);
      map.add(Batas_Kecamatan);
      
      // Legend Muka Peta 1
      const legend = new Expand({
          content: new Legend({
            view: View,
            style: "classic", // other styles include 'classic/classic'
            layerInfos: [
              {
                layer: BidangPTP,
                title: "KETERANGAN"
              },
              {
                layer: RTRW,
                title: ""
              },
            ],
          view: View,
          expanded: false,
      })});
      View.ui.add(new Expand({
                    content: new LayerList({
                    view: View,
                  }),
              view: View,
              group: "bottom-left"}),
      "bottom-left");
      // Gonta-ganti basemap
      const toggle = new BasemapToggle({
          view: View,
          nextBasemap: "hybrid"
        });
      //Location Button
      const locateBtn = new Locate({
          view: View
        });
      //North
      const compassWidget = new Compass({
          view: View
        });
      //Scale Bar
      const scaleBar = new ScaleBar({
          view: View,
          unit: "dual" // The scale bar displays both metric and non-metric units.
        });

      //swipe
      const swipe = new Swipe({
          leadingLayers: ([BidangPTP,RTRW]),
          trailingLayers: ([BidangPTP,LSD]),
          position: 0, // set position of widget to 35%
          view: View
        });

      //FULL SCREEN
      fullscreen = new Fullscreen({
          view: View
        });
      View.ui.add(fullscreen, "top-left");
      //SEARCH
        const searchWidget = new Search({
          view: View,
          allPlaceholder: "Cari Berdasarkan",
          includeDefaultSources: false,
          sources: [
            {
              layer: Batas_Kecamatan,
              searchFields: ["KEC"],
              displayField: "KEC",
              exactMatch: false,
              outFields: ["KEC"],
              name: "KECAMATAN",
              zoomScale: 50000,
              placeholder: "Contoh: JUMANTONO"
            },
            {
              layer: BatasAdmin_Kelurahan,
              searchFields: ["DESA"],
              displayField: "DESA",
              exactMatch: false,
              outFields: ["DESA"],
              name: "DESA",
              zoomScale: 10000,
              placeholder: "Contoh: NGIJO"
            },
            {
              layer: BidangPTP,
              searchFields: ["Berkas"],
              displayField: "Berkas",
              exactMatch: false,
              outFields: ["Berkas"],
              name: "NOMOR BERKAS",
              zoomScale: 1000,
              placeholder: "Contoh: 51426/2023"
            }]
        });
      //Jajaran widget
        View.ui.add(searchWidget, {position: "top-right"});
        View.ui.add(locateBtn, {position: "top-left"});
        View.ui.add(toggle, "bottom-right");
        View.ui.add(compassWidget, "top-left");
        View.ui.add(swipe);
        View.ui.add(scaleBar, {position: "bottom-right"});
        View.ui.add(legend, "bottom-right");
      }
     )
    </script>
